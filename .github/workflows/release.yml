name: Release

# Least privilege by default: every job declares only what it needs below.
permissions: {}
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows"
            platform: "windows-latest"
            args: "--bundles nsis"
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: true
          - name: "macOS Apple Silicon"
            platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles dmg"
            rustTargets: "aarch64-apple-darwin"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
          - name: "macOS Intel"
            platform: "macos-latest"
            args: "--target x86_64-apple-darwin --bundles dmg"
            rustTargets: "x86_64-apple-darwin"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
          - name: "Linux"
            platform: "ubuntu-22.04"
            args: "--bundles appimage,deb"
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
    runs-on: ${{ matrix.platform }}

    steps:
      # Supply-chain hardening (security review H1): every third-party action
      # is pinned to a full commit SHA — mutable tags/branches can be moved by
      # a compromised maintainer account and would run inside a job that holds
      # the updater signing key. Bump via Dependabot PRs, which update both
      # the SHA and the trailing version comment.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58 # 1.96.0
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Match ci.yml — must read the bun.lock format the local bun wrote.
          bun-version: 1.4.2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (docs/releases.md): the private key lives in the
          # repo secrets; the matching public key is pinned in
          # src-tauri/tauri.conf.json plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            See the assets below to download this version.
            The Windows portable executable requires the Microsoft Edge WebView2 Runtime.
          # Channel model (docs/releases.md): a tag with a prerelease suffix
          # (v0.2.0-beta.1) publishes immediately as a prerelease — the beta
          # channel; a plain tag (v0.2.0) publishes as the stable/latest
          # release. The app version must equal the tag (npm run version:set).
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          retryAttempts: 2
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.assetPattern }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          includeUpdaterJson: true

      - name: Upload Windows portable executable
        if: matrix.portableUpload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $metadata = cargo metadata --manifest-path "src-tauri/Cargo.toml" --no-deps --format-version 1 | ConvertFrom-Json
          $binaryTarget = $metadata.packages[0].targets |
            Where-Object { $_.kind -contains "bin" } |
            Select-Object -First 1

          if (-not $binaryTarget) {
            throw "Could not determine the Windows binary target from Cargo metadata."
          }

          $binaryPath = Join-Path "src-tauri/target/release" "$($binaryTarget.name).exe"
          if (-not (Test-Path -LiteralPath $binaryPath)) {
            throw "Portable executable was not found at $binaryPath."
          }

          $safeProductName = ($config.productName -replace '[^A-Za-z0-9._-]+', '-').Trim('-')
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $assetName = "$safeProductName-$version-windows-x64-portable.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName

          Copy-Item -LiteralPath $binaryPath -Destination $assetPath
          gh release upload "v$version" $assetPath --clobber

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: \`${{ matrix.name }}\`"
            echo "- Version: \`${{ steps.tauri.outputs.appVersion }}\`"
            echo "- Release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
            echo "- Artifacts: \`${{ steps.tauri.outputs.artifactPaths }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Mirror this build's updater manifest onto the perpetual "channels"
  # release: stable tags land as latest-stable.json, prerelease tags as
  # latest-beta.json. The in-app updater reads those two static URLs
  # (src/services/updates/updater.ts), so a channel switch is just a
  # manifest swap — GitHub's "latest" release excludes prereleases, which
  # is what keeps the two channels separate. Runs only when every platform
  # leg built, so a manifest never points at a partial release.
  publish-channel-manifests:
    needs: publish-tauri
    if: ${{ needs.publish-tauri.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Upload channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            MANIFEST="latest-beta.json"
          else
            MANIFEST="latest-stable.json"
          fi

          gh release download "v$VERSION" --pattern "latest.json" --output "/tmp/latest.json"
          cp "/tmp/latest.json" "/tmp/$MANIFEST"

          if ! gh release view "channels" >/dev/null 2>&1; then
            gh release create "channels" \
              --title "Release channel manifests" \
              --notes "Moving updater manifests for the beta and stable channels. Not a downloadable release — see the versioned releases." \
              --latest=false
          fi
          gh release upload "channels" "/tmp/$MANIFEST" --clobber
          echo "Manifest published: channels/$MANIFEST (v$VERSION)"
