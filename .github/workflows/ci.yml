name: CI

# CI gate (security review L8): typecheck + tests on every push/PR, plus a
# dependency advisory scan against both lockfiles. Fork PRs carry no
# secrets — every job here is read-only over the checkout.
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-pinned like release.yml (security review H1).
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

  rust:
    name: Rust (check, tests)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@237493ca54d1a1baf507a5ca665506aa0d208a0a # 1.120.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  osv:
    name: Dependency advisories (OSV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # OSV-Scanner walks the repo and version-matches bun.lock +
      # src-tauri/Cargo.lock against the OSV database (security review M5
      # was exactly the class of advisory this job exists to catch).
      - name: Scan lockfiles
        # The runnable action lives at the repo subpath — the repository
        # root action.yml is a metadata-only stub in v2.
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            -r
            ./
