name: CI

# CI gate (security review L8): typecheck + tests on every push/PR, plus a
# dependency advisory scan against both lockfiles. Fork PRs carry no
# secrets — every job here is read-only over the checkout.
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-pinned like release.yml (security review H1).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in lockstep with the local bun that writes bun.lock — a
          # newer lockfile format fails `bun install --frozen-lockfile` on
          # an older bun ("Unknown lockfile version").
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The vitest executor runs on Node's built-in SQLite (node:sqlite in
      # src/services/db/__tests__/test-executor.ts) — keep Node ≥ 24 so the
      # builtin is stable and vite can resolve it.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

  rust:
    name: Rust (check, tests)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58 # 1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  osv:
    name: Dependency advisories (OSV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OSV-Scanner walks the repo and version-matches bun.lock +
      # src-tauri/Cargo.lock against the OSV database (security review M5
      # was exactly the class of advisory this job exists to catch).
      - name: Scan lockfiles
        # The runnable action lives at the repo subpath — the repository
        # root action.yml is a metadata-only stub in v2.
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            -r
            --config=osv-scanner.toml
            ./
