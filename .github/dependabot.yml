# Dependabot keeps the SHA-pinned actions in .github/workflows current
# (security review H1): for commit-SHA pins it opens PRs that update the
# SHA and the trailing version comment together. Cargo/npm entries keep
# dependency update PRs flowing so the CI osv job stays quiet.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
