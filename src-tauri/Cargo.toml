[package]
name = "tauri-native"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tauri plugins
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# In-app update checks (settings "Updates" section) + relaunch after install
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Mail engine (IMAP fetch / message parsing / SMTP send)
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# "rt" + "macros" power #[tokio::test] for the OAuth loopback server tests
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }
tokio-native-tls = "0.3"
futures = "0.3"
mail-parser = "0.11"
# Attachment content crosses the Tauri JSON bridge base64-encoded (D15)
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-native-tls",
    "builder",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# opt-level "s": optimize for size (the app is I/O-bound — IMAP/SMTP/DB —
# so the "3"→"s" binary-size win costs nothing noticeable in practice).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
# The macOS toolchain currently corrupts STRIPPED proc-macro dylibs
# ("mis-aligned LINKEDIT string pool" dlopen failure, e.g. sqlx-macros —
# the release build fails to compile), so host artifacts (proc-macros,
# build scripts) opt out of stripping; the shipped binary still gets it.
[profile.release.build-override]
strip = false
