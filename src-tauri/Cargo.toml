[package]
name = "tauri-native"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Heavy native features (parity-round-3 tasks 1.1, design D1/D3): both are
# ON by default so release/CI builds ship them, and both compile OUT for
# fast local iteration with `cargo check --no-default-features` (or
# `--no-default-features --features local-embeddings` to keep just one).
# CI legs build the default set so release validation is unaffected.
[features]
default = ["local-embeddings", "voice"]
# Local semantic-search embeddings (design D1): candle runs the
# BGE-small-en-v1.5 model (384-dim) on CPU for the assistant's
# semantic_search tool. Frontend owns storage (migration v21
# thread_vectors); Rust only computes `embed_texts` batches (task 6.1).
local-embeddings = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
# Local voice dictation (design D3): whisper.cpp bindings behind the same
# opt-out; the `transcribe` command lands in task 7.1.
voice = ["dep:whisper-rs"]

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
# tray-icon: system tray with unread tooltip + Open/Compose/Quit menu (spec
# desktop-integration "System tray"); Rust-side only, no capability entries.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tauri plugins
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# In-app update checks (settings "Updates" section) + relaunch after install
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Desktop integration (Phase 1, spec desktop-integration): single-instance
# lock with argv relay, launch-at-login, mailto: deep links, global compose
# shortcut. D7 in the change design.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"

# Mail engine (IMAP fetch / message parsing / SMTP send)
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }# "rt" + "macros" power #[tokio::test] for the OAuth loopback server tests
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }
tokio-native-tls = "0.3"
futures = "0.3"
mail-parser = "0.11"
# Attachment content crosses the Tauri JSON bridge base64-encoded (D15)
base64 = "0.22"
# Gravatar avatar lookups (task 2.5, design D12): SHA-256 of the trimmed,
# lowercased address is the cache-file name and the gravatar.com URL key.
# Already in the dependency tree transitively; only newly declared here.
sha2 = "0.11"
# Backup archive writer (parity-round-3 design D4): the `.emailer-backup`
# format is a tar+gz of the manifest + the stripped DB snapshot. Rust only
# touches file bytes — every SQL statement stays frontend-side.
tar = "0.4"
flate2 = "1"
# Model downloader (parity-round-3 tasks 1.4, design D1/D3): streams
# HuggingFace model files to a temp file with progress events and
# SHA-256 verification before the atomic rename into place. reqwest is
# already in the tree (tauri-plugin-updater); the `stream` feature powers
# incremental reads of the response body.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }

# ---------- Local-AI optional dependencies (see [features] above) ----------
# Known-good candle 0.9 family, resolved together: candle-transformers 0.9
# pairs with tokenizers 0.21; hf-hub 0.4 provides the pinned-revision
# HuggingFace fetch the model download flow builds on.
candle-core = { version = "0.9", optional = true }
# candle-nn rides the local-embeddings feature: VarBuilder (the safetensors
# loader BertModel::load consumes) lives here, and candle-transformers
# already pulls the same 0.9 version into the tree.
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.21", optional = true }
hf-hub = { version = "0.4", optional = true, features = ["tokio"] }
# whisper.cpp bindings for local dictation (design D3); builds whisper.cpp
# from source via the cc/cmake toolchain.
whisper-rs = { version = "0.14", optional = true }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-native-tls",
    "builder",
] }
# OS secret stores for the credential-encryption key (roadmap item from
# the security review: replace the plaintext credentials.key file).
# Feature set "v1" = apple keychain (macOS), windows credential manager,
# zbus secret service (Linux); the plaintext file remains the fallback
# when the OS store is unavailable.
keyring = { version = "4.2", default-features = false, features = ["v1"] }

# Minimal CalDAV client (task 5.2, design D5): WebDAV/CalDAV servers answer
# PROPFIND/REPORT with namespaced multistatus XML whose property order,
# prefixes and entity encoding vary per server (Radicale / Nextcloud /
# Fastmail). Design D5 names quick-xml for this — the ONE new crate this
# task adds, zero transitive dependencies, events-based parsing only (no
# serde feature). CalDAV's calendar-data payloads embed XML-escaped
# iCalendar text, so hand-rolled string walking would have to re-implement
# entity decoding to stay correct; the audited-dependencies posture is kept
# by pinning this single, tiny, no-dep crate.
quick-xml = "0.42"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# opt-level "s": optimize for size (the app is I/O-bound — IMAP/SMTP/DB —
# so the "3"→"s" binary-size win costs nothing noticeable in practice).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
# The macOS toolchain currently corrupts STRIPPED proc-macro dylibs
# ("mis-aligned LINKEDIT string pool" dlopen failure, e.g. sqlx-macros —
# the release build fails to compile), so host artifacts (proc-macros,
# build scripts) opt out of stripping; the shipped binary still gets it.
[profile.release.build-override]
strip = false

# macOS-only desktop integration (task 1.4): LaunchServices C API for the
# mailto default-handler control (core-foundation provides the CFString
# wrappers; the two LSCopy/SetDefaultHandlerForURLScheme functions are
# linked directly — see desktop.rs default_handler).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
# tauri's mock runtime + mock app builder: powers the fs-scope unit tests
# in mail_import.rs without a real window (test-only feature, never
# compiled into shipped builds).
tauri = { version = "2", features = ["test"] }
