# OSV-scanner config (ci.yml "Dependency advisories" job). Only additives
# belong here: every entry must name the transitive path and the reason
# there is nothing to upgrade to, so the gate stays meaningful for NEW
# advisories. Prune entries whose upstream ships a fix.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
# glib 0.18.5 — patched in 0.20.0, but tauri 2's Linux tray stack
# (tray-icon → libappindicator → gtk 0.18) pins the gtk-rs 0.18 line,
# so 0.20 is semver-unreachable from Cargo.toml. Revisit at the next
# tauri upgrade that moves the Linux stack.
[[IgnoredVulns]]
